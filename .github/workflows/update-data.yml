name: Actualizar datos Chacabuco en Red

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC ~ 04:00 ART. Ajustar el horario si hace falta.
  workflow_dispatch: {}    # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar API de 360playvid
        env:
          PLAYVID_EMAIL: ${{ secrets.PLAYVID_EMAIL }}
          PLAYVID_PASSWORD: ${{ secrets.PLAYVID_PASSWORD }}
        run: node fetch-data.js

      - name: Commitear data.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar data.json $(date -u +%Y-%m-%d)"
          git push
